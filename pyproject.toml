[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-clone-detection"
version = "0.1.0"
description = "Privacy-first streaming synthetic speech detection MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]
ml = ["torch>=2.3", "numpy>=1.26"]
data = ["huggingface_hub>=0.20", "hf_transfer>=0.1"]
tier2 = ["numpy>=1.26", "onnx>=1.17", "onnxruntime>=1.20", "transformers>=4.57"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
